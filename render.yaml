services:
  - type: web
    name: godseye-web
    runtime: python
    plan: free
    branch: claude/http-app-live-internet-bxwzsg
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --chdir webapp --workers 2 --threads 4 --timeout 300 --bind 0.0.0.0:$PORT app:app
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: FORCE_HTTPS
        value: "1"
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: GODSEYE_USERNAME
        sync: false
      - key: GODSEYE_PASSWORD
        sync: false
